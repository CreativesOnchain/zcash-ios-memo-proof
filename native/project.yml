name: MemoProof
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  ZcashLightClientKit:
    path: ../.run/zignal/vendor/zcash-swift-wallet-sdk
targets:
  MemoProof:
    type: application
    platform: iOS
    sources:
      - MemoProof.swift
    dependencies:
      - package: ZcashLightClientKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Memo Proof
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.zcash.memoproof
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  MemoProof:
    build:
      targets:
        MemoProof: all

